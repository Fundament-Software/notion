[package]
name = "notion"
version = "0.7.1"
authors = [
  "Jake Swenson <jake@jakeswenson.com>",
  "Erik McClure <erikm@fundament.software>",
]
edition = "2024"
repository = "https://github.com/fundament-software/notion"
readme = "README.md"

description = "A Notion Api Client, except it actually works"
license = "MIT"

[dependencies]
serde_json = "1.0"
serde_path_to_error = { version = "0.1", optional = true }
thiserror = "2.0"
tracing = "0.1"
time = { version = "0.3.53", features = [
  "serde",
  "serde-human-readable",
  "parsing",
  "formatting",
] }

[features]
debugging = ["serde_path_to_error"]

[dependencies.reqwest]
version = "0.13"
features = ["json", "query"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies]
cargo-husky = "1"
wiremock = "0.6.5"
anyhow = "1.0.103"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
toml = "1.1.3"

[target.'cfg(not(windows))'.dependencies]
skim = "5.2.0"

[dev-dependencies.config]
version = "0.15.25"
features = ["toml"]
